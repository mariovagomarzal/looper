name: Looper

options:
  bundleIdPrefix: com.mariovagomarzal
  deploymentTarget:
    macOS: "15.0"

packages:
  LooperCore:
    path: Packages/LooperCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Looper:
    type: application
    platform: macOS
    sources:
      - App/Looper
    dependencies:
      - package: LooperCore
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariovagomarzal.Looper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Looper
        # Menu bar app without a Dock icon.
        INFOPLIST_KEY_LSUIElement: YES
        # The Accessibility API doesn't work inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        # macOS ties the Accessibility permission to the signing identity, so
        # builds use a stable self-signed certificate from the login keychain.
        CODE_SIGN_IDENTITY: Looper Development
        CODE_SIGN_STYLE: Manual
